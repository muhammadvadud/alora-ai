name: "buyurtma — to'liq: hisob, taklif, draft (PIIsiz)"
role: employee

steps:
  - user: "Karniz 4 m, balandlik 2.6 m. Velvet Milano grafitni hisoblang."
    llm:
      - tools:
          - name: curtain_calculate
            args:
              cornice_length_m: 4
              height_m: 2.6
              room_name: "Mehmonxona"
              parts:
                - variant_id: v-hitech-grafit
                  role: portyera
                  coefficient: 2.5
      - text: "Mato 4 680 000 so'm."
    expect_tools: ["curtain_calculate"]
    expect_stage: calc
    expect_products: false

  - user: "Tikuv, tasma, ilgich va yetkazib berishni qo'shib avansini ayt."
    llm:
      - tools:
          - name: price_quote
            args:
              services: [sewing, tape, hook]
              need_delivery: true
      - text: "Jami 5 070 000 so'm, avans 2 535 000 so'm."
    expect_tools: ["price_quote"]
    expect_stage: calc
    expect_products: false
    forbid_price_outside_tools: true

  # ADR-020: AI mijoz ma'lumotlarini YIG'MAYDI. Draft faqat taklif + forma talabini
  # qaytaradi — savollash to'xtaydi, sotuvchi ilova formasini ochadi.
  - user: "Buyurtma qoralamasini tayyorla."
    llm:
      - tools:
          - name: order_draft
            args:
              action: draft
      - text: >
          Buyurtma qoralamasi tayyor: jami 5 070 000 so'm.
          Mijoz ismi, telefon va manzilini ilova formasida kiritadi.
    expect_tools: ["order_draft"]
    expect_stage: order
    expect_products: false
    expect_result_contains:
      - '"customer_form_required":true'
    forbid_content_regex:
      - 'so.?rayman'
      - 'ismingiz'
      - 'telefoningiz'
      - 'manzilingiz'
    forbid_price_outside_tools: true
