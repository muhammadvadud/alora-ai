name: "ofis — minimal uslub"
role: employee

steps:
  - user: "Ofis uchun minimal uslubdagi parda kerak."
    llm:
      - tools:
          - name: set_context
            args:
              room: office
              style: minimal
              colors: "oq, kulrang"
