# Alora AI agent — Docker orqali ishga tushirish.
# Ishlaydigan konfiguratsiya `docker/docker-compose.yml` da (backend tarmog'i `backend_default`,
# kalitlar ildizdagi `.env` dan: DEEPSEEK_API_KEY, AGENT_SERVICE_TOKEN). Bu fayl shunchaki unga
# yo'naltiradi — `docker compose up -d` ildizdan ham ishlaydi.
#
# Tartib:
#   1) cd ../backend && docker compose up -d        (db, redis, grpc, django, nginx)
#   2) cd ../ai && docker compose up -d --build     (agent — shu fayl)
#   Tekshirish: curl http://127.0.0.1:8081/readyz  → {"status":"ok"}
include:
  - docker/docker-compose.yml
