# Suhbat tarixi uchun PostgreSQL. Ishga tushirish: docker compose up -d
# So'ng: DATABASE_URL=postgres://agent:agent@localhost:5432/agent?sslmode=disable
services:
  postgres:
    image: postgres:16-alpine
    container_name: baholash-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
