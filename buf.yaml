version: v1

lint:
  use:
    - STANDARD
  # Proto backend bilan umumiy kontrakt; naming/directory qoidalari mavjud
  # backward-compatible nomlarni o'zgartirishni talab qilgani uchun chiqarildi.
  except:
    - PACKAGE_DIRECTORY_MATCH
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE

breaking:
  use:
    - FILE
