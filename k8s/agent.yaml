# Alora AI Agent — Kubernetes manifestlari (rules.md §17, tasks.md 4.7)
# Bitta fayl, `---` bilan ajratilgan. Namespace: alora.
# Batafsil qo'llash tartibi: k8s/README.md
---
apiVersion: v1
kind: Namespace
metadata:
  name: alora
  labels:
    app: alora-agent
    # Prometheus Operator'ning namespace-selectori uchun (ServiceMonitor bilan mos).
    app.kubernetes.io/part-of: alora
---
# Konfiguratsiya — configs/config.yaml mazmuni (kalitlar YO'Q, rules.md §12.2).
# grpc :9090, http :8081 o'zgarmagan; backend Django gRPC servisiga ko'rsatilgan.
# db/redis manzillari ENV'dan keladi (DATABASE_URL — secret'da).
apiVersion: v1
kind: ConfigMap
metadata:
  name: alora-agent-config
  namespace: alora
  labels:
    app: alora-agent
data:
  config.yaml: |
    # API kalit bu yerda EMAS — provider'ga qarab ENV'dan olinadi (secret orqali):
    #   deepseek -> DEEPSEEK_API_KEY,  openai -> OPENAI_API_KEY,  claude -> ANTHROPIC_API_KEY
    #   whisper -> OPENAI_API_KEY,  elevenlabs -> ELEVENLABS_API_KEY
    # Har qiymatni MUHIT orqali ustidan yozish mumkin: ALORA_ prefiks (ALORA_BACKEND_ADDR ...)

    mode: grpc # grpc | cli | http  (Deployment args --mode grpc bilan ham tasdiqlanadi)

    llm:
      provider: deepseek # deepseek | openai | claude | ollama
      model: deepseek-v4-pro
      base_url: https://api.deepseek.com/v1
      max_tokens: 2048
      temperature: 0.5 # sotuvda barqarorlik uchun 0.7 dan pastroq
      timeout: 60s
      thinking: adaptive
      reasoning_effort: ""
      # Asosiy provider ketma-ket 2 marta xato/timeout bersa, shu provider bilan qayta (rules §6.5).
      fallback_provider: claude

    agent:
      max_step: 20
      max_history: 120
      stream: true
      system_prompt: "" # Prompt Django'dan sinxronlanadi

    # Asosiy gRPC transport (rules.md §8). Token secret'dan: AGENT_SERVICE_TOKEN.
    grpc:
      addr: ":9090"
      service_token_env: AGENT_SERVICE_TOKEN
      auth_required: true
      max_sessions: 100
      keepalive: 30s

    # HTTP — faqat /healthz, /readyz, /metrics (biznes endpoint yo'q, alohida port).
    http:
      addr: ":8081"

    # Go -> Django klient. K8s'da Django gRPC servisining DNS nomi (Egress quyida).
    backend:
      addr: "alora-backend-grpc:50051"
      timeout: 5s
      retry: 3

    # Katalog cache sinxroni (rules.md §4.1). /readyz snapshot tugamaguncha 503 qaytaradi.
    catalog:
      snapshot_on_start: true
      stale_after: 10m
      page_size: 500

    knowledge:
      inline_max: 50

    # Ovoz; kalitlar secret'dan: OPENAI_API_KEY, ELEVENLABS_API_KEY.
    stt:
      provider: whisper
      language: uz
    tts:
      provider: elevenlabs
      voice: "uz_female_1"
      speed: 1.0

    db:
      url: "" # Postgres URL — faqat ENV'dan: DATABASE_URL (secret). Bo'sh bo'lsa in-memory.
      auto_migrate: false # prod'da migratsiya alohida buyruq bilan

    # faqat Django ulanmaganda
    fallback:
      system_prompt: ""

    log_level: info # debug | info | warn | error
---
# Namuna Secret — bo'sh qiymatlar bilan. Haqiqiy qiymatlar shu faylda EMAS:
# prod'da YO'Q hech qanday haqiqiy qiymat — ular sealed-secrets/vault orqali
# beriladi (kubeseal yoki vault injector), config faylga ham, yaml'ga ham yozilmaydi.
# Kalitlar rules.md §12.2 ro'yxati bilan bir xil:
#   DEEPSEEK_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY (STT zaxira),
#   ELEVENLABS_API_KEY (TTS), AGENT_SERVICE_TOKEN (gRPC auth), DATABASE_URL (Postgres).
apiVersion: v1
kind: Secret
metadata:
  name: alora-agent-secrets
  namespace: alora
  labels:
    app: alora-agent
type: Opaque
stringData:
  DEEPSEEK_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  ELEVENLABS_API_KEY: ""
  AGENT_SERVICE_TOKEN: ""
  DATABASE_URL: ""
---
# Deployment — 2 instans, RollingUpdate (maxUnavailable 0 → xizmat uzilmaydi).
# resources rules.md §15 byudjetiga mos: 50 parallel sessiya ~ 1 instans.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alora-agent
  namespace: alora
  labels:
    app: alora-agent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: alora-agent
  template:
    metadata:
      labels:
        app: alora-agent
    spec:
      # Graceful shutdown: SIGTERM -> GracefulStop 15s (rules.md §8/1.38), 30s chegara.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:            # distroless/nonroot uchun xavfsiz default
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: alora-agent
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: alora-agent
      containers:
        - name: alora-agent
          # ${TAG} — kustomize/CI almashtiradi (masalan v0.1.0). Qo'lda: sed/argocd.
          image: ghcr.io/muhammadvadud/alora-agent:${TAG}
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/alora/config.yaml
            - --mode
            - grpc
          envFrom:
            - secretRef:
                name: alora-agent-secrets
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: http-metrics
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/alora/config.yaml
              subPath: config.yaml
              readOnly: true
          # readyz tugashi: katalog snapshot tugamaguncha 503 (rules.md §4.1.3).
          # Startup uchun katalogni yuklash vaqti beriladi (≤ 30 * 10s = 300s, 10k mahsulot ~ 10s).
          startupProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: alora-agent-config
---
# ClusterIP — faqat ichki tarmoq (rules.md §16.1; gRPC tashqariga ochilmaydi).
apiVersion: v1
kind: Service
metadata:
  name: alora-agent
  namespace: alora
  labels:
    app: alora-agent
spec:
  type: ClusterIP
  selector:
    app: alora-agent
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
    - name: http-metrics
      port: 8081
      targetPort: http-metrics
      protocol: TCP
---
# HPA — CPU/mem asosida 2..5 instans. 1 instans ~ 50 parallel sessiya (rules §15),
# CPU 70% oshsa yangi instans qo'shiladi (yuklama to'plami). ScaleDown sekin —
# shpiksdan keyin keraksiz qisqarish bo'lmasin (stabilizatsiya 5 daq).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alora-agent
  namespace: alora
  labels:
    app: alora-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alora-agent
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
# PDB — replicas 2 dan kam bo'lmasin; node ishdan chiqishda ham 1 instans qoladi.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alora-agent
  namespace: alora
  labels:
    app: alora-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: alora-agent
---
# ServiceMonitor — faqat Prometheus Operator o'rnatilgan bo'lsa kerak (izoh).
# /metrics :8081 (rules.md §13.1). Grafana dashboard: docs/grafana/alora-agent.json.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alora-agent
  namespace: alora
  labels:
    app: alora-agent
    release: prometheus # Prometheus CR ning serviceMonitorSelector'iga mos kelishi mumkin
spec:
  selector:
    matchLabels:
      app: alora-agent
  namespaceSelector:
    matchNames:
      - alora
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 15s
---
# NetworkPolicy — minimal ruxsat (zero-trust). Ingress: faqat Django gRPC va monitoring.
# Egress: faqat zarur xizmatlar + DNS + HTTPS (LLM API, rules.md §16).
# Diqqat: CNI kubelet probe trafigini policy'dan o'tkazmasa (host-network),
# /healthz, /readyz uchun node CIDR'ga ruxsat qo'shish kerak (k8s/README.md ga qarang).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alora-agent
  namespace: alora
  labels:
    app: alora-agent
spec:
  podSelector:
    matchLabels:
      app: alora-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Django (backend) gatew'ining agent gRPC'ga murojaati — asosiy yo'l.
    - from:
        - podSelector:
            matchLabels:
              app: alora-backend
      ports:
        - protocol: TCP
          port: 9090
    # Prometheus scrape (monitoring namespace'idan) — 8081.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # Django gRPC servisi (alora-backend-grpc:50051).
    - to:
        - podSelector:
            matchLabels:
              app: alora-backend
      ports:
        - protocol: TCP
          port: 50051
    # PostgreSQL — DATABASE_URL'dagi host (label'lar real deployment bilan mos kelishi kerak).
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis — hozir Go ishlatmaydi (ADR-007: outbox Postgres'da); MKA havola uchun.
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # DNS — CoreDNS (kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS — LLM provider API'lari (DeepSeek/Anthropic/OpenAI/ElevenLabs, rules.md §12.2).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443